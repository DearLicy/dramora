name: guomu
description: 果幕 - 黄果短剧第三方 Flutter 客户端。
publish_to: 'none'
version: 1.4.0+5

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  html: ^0.15.6
  pointycastle: ^4.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  video_player: ^2.10.1
  waterfall_flow: ^3.1.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/data/source_manifest.json
  fonts:
    - family: GuomuLatin
      fonts:
        - asset: assets/fonts/GuomuLatin-Regular.ttf
          weight: 400
        - asset: assets/fonts/GuomuLatin-Medium.ttf
          weight: 500
        - asset: assets/fonts/GuomuLatin-Bold.ttf
          weight: 700
    - family: GuomuCJK
      fonts:
        - asset: assets/fonts/GuomuCJK.ttf
