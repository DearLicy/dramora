name: 数据源不可用
description: 首页、搜索、分类、评论、登录或播放无法连接
title: "[数据源]: "
labels: [data-source, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        黄果线路会不定期更换。请先在果幕设置页执行“同步地址”和“线路测速”，再填写本表单。
        不要填写账号密码、token、Cookie、完整请求头、证书或私钥。
  - type: input
    id: version
    attributes:
      label: 果幕版本
      placeholder: 例如 v1.4.33 (39)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android
        - iOS
        - Web 预览
        - 其他
    validations:
      required: true
  - type: input
    id: network
    attributes:
      label: 网络环境
      placeholder: 例如 Wi-Fi / 5G / 是否开启代理
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 当前线路与测速结果
      description: 设置页显示的最佳源、延迟、状态；只需填写域名，不要填写任何认证信息
      placeholder: 例如 https://thu.oicawahgq.cc，延迟 210ms，显示可用/不可用
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: 同一网络浏览器能否打开该线路
      options:
        - 可以打开，页面正常
        - 可以打开，但页面空白或报错
        - 打不开
        - 尚未测试
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: 受影响页面
      description: 例如首页、搜索、分类、专题、详情、登录、评论、播放地址
      placeholder: 请写出具体页面和点击后的提示
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与错误提示
      description: 可附脱敏截图或日志；不要粘贴 Authorization 请求头
    validations:
      required: true
