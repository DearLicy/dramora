name: Build Guomu

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: guomu-main
  cancel-in-progress: false

env:
  HG_API_BASE: https://thu.oicawahgq.cc

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool/tests -p 'test_sync_sources.py'

  build-web:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - name: Build static web
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --no-wasm-dry-run \
            --base-href="/guomu/" \
            --dart-define="HG_API_BASE=$HG_API_BASE" \
            --dart-define="HG_WEB_PROXY_URL=${{ vars.HG_WEB_PROXY_URL }}" \
            --dart-define="HG_WEB_PREVIEW_ONLY=true"
          touch build/web/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    needs: build-web
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - run: flutter pub get
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Android release signing is not configured.'; exit 1; }
          mkdir -p .tmp/signing
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          root = Path.cwd()
          key = root / '.tmp/signing/guomu-release.p12'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          Path('android/key.properties').write_text(
              'storeFile=' + str(key) + '\n' +
              'storePassword=' + os.environ['ANDROID_KEYSTORE_PASSWORD'] + '\n' +
              'keyAlias=' + os.environ['ANDROID_KEY_ALIAS'] + '\n' +
              'keyPassword=' + os.environ['ANDROID_KEY_PASSWORD'] + '\n')
          PY
          flutter build apk --release \
            --dart-define="HG_API_BASE=$HG_API_BASE"
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d+ -f1)"
          cp build/app/outputs/flutter-apk/app-release.apk "Guomu-${VERSION}.apk"
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties .tmp/signing/guomu-release.p12
      - uses: actions/upload-artifact@v7
        with:
          name: guomu-android
          path: Guomu-*.apk
          if-no-files-found: error

  build-ios:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.1
          cache: true
      - name: Build unsigned IPA
        run: bash tool/build_ipa_unsigned.sh
      - uses: actions/upload-artifact@v7
        with:
          name: guomu-ios
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  release:
    needs:
      - build-android
      - build-ios
    if: ${{ github.ref == 'refs/heads/main' && always() && needs.build-android.result == 'success' && needs.build-ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: guomu-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d+ -f1)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "果幕 ${TAG}" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "果幕 ${TAG}" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" release-assets/* --clobber
